<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PUSHNOT // Push Notification 3D Orbit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
  <script type="importmap">
    { "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    } }
  </script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="load-status" class="load-status">Loading 3D scene…</div>

  <!-- Minimal top bar -->
  <div class="top-brand">
    <span class="dot"></span>
    <span>PUSHNOT</span>
  </div>
  <button class="btn-fs" id="btn-fullscreen" title="Fullscreen">⛶</button>

  <!-- Minimal in-world station labels -->
  <div class="pin pin-node" id="pin-phone">PHONE</div>
  <div class="pin pin-node" id="pin-server">SERVER</div>
  <div class="pin pin-node" id="pin-cloud">CLOUD · APNs / FCM</div>

  <!-- Single active contextual callout (only one shown at a time) -->
  <div class="pin pin-event" id="pin-install">
    <span class="app-tile">M</span>
    <div>
      <div class="ev-title">MyApp Installed</div>
      <div class="ev-sub">Requests push address</div>
    </div>
  </div>

  <div class="pin pin-event amber" id="pin-token">
    <span class="ev-ico">🔑</span>
    <div>
      <div class="ev-title">Device Token</div>
      <div class="ev-sub">apns:7f4a…e891</div>
    </div>
  </div>

  <div class="pin pin-event cyan" id="pin-saved">
    <span class="ev-ico">✓</span>
    <div>
      <div class="ev-title">Token Registered</div>
      <div class="ev-sub">Linked to user account</div>
    </div>
  </div>

  <div class="pin pin-event green" id="pin-push">
    <span class="ev-ico">📦</span>
    <div>
      <div class="ev-title">Order Shipped</div>
      <div class="ev-sub">MyApp · Push delivered</div>
    </div>
  </div>

  <!-- Moving packet pill -->
  <div class="pin pin-mover" id="pin-mover"></div>

  <!-- Ultra-clean bottom orbit dock -->
  <nav class="orbit-dock">
    <div class="steps">
      <button class="step active" data-step="0"><span>1</span> Install App</button>
      <button class="step" data-step="1"><span>2</span> Create Token</button>
      <button class="step" data-step="2"><span>3</span> Save to Server</button>
      <button class="step" data-step="3"><span>4</span> Cloud → Push</button>
    </div>
    <div class="controls">
      <button class="ctl" id="btn-prev" title="Previous">◀</button>
      <button class="ctl play" id="btn-play" title="Play / Pause">▶</button>
      <input type="range" id="scrub" min="0" max="1000" value="0" />
      <button class="ctl" id="btn-next" title="Next">▶▶</button>
      <button class="ctl orbit-toggle on" id="btn-orbit" title="Auto-orbit camera">⟳ Orbit</button>
    </div>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
